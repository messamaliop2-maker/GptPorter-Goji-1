
name: Build Godzilla Forge 1.20.1 Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Combine ZIP parts
        run: |
          cat G1_Forge_1.20.1_GitHub_Build_Ready.zip.part00 \
              G1_Forge_1.20.1_GitHub_Build_Ready.zip.part01 \
              > project.zip

      - name: Extract project
        run: unzip -o project.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build Forge mod
        run: gradle --no-daemon -p G1_Forge_1.20.1 clean build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Godzilla-Minus-One-Forge-1.20.1
          path: G1_Forge_1.20.1/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
